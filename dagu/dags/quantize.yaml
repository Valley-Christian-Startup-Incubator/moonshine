# Quantization DAG — runs mlx_lm.convert with quantization flags. Outputs a
# quantized model directory under the results dir. INPUT_FILE is unused for
# this job type but kept for a uniform submission flow from the web app.

name: quantize
queue: mac-studio
maxActiveRuns: 1
timeoutSec: 14400 # 4 hours

params: >
  JOB_ID=
  TEAM=
  INPUT_FILE=
  MODEL_PATH=mlx-community/Meta-Llama-3.1-8B-Instruct
  Q_BITS=4
  Q_GROUP_SIZE=64

env:
  - DISTILL_HOME: ${HOME}/.distill
  - RESULTS_DIR: ${DISTILL_HOME}/results/${JOB_ID}
  - VENV: ${HOME}/.distill-venv
  - QUANTIZED_DIR: ${RESULTS_DIR}/quantized-model

steps:
  - name: prepare
    command: mkdir -p ${RESULTS_DIR}

  - name: mark-running
    command: >
      ${VENV}/bin/python ${DISTILL_HOME}/scripts/completion_hook.py
      --job-id "${JOB_ID}" --status running

  - name: convert-quantize
    command: >
      ${VENV}/bin/mlx_lm.convert
      --hf-path "${MODEL_PATH}"
      --mlx-path "${QUANTIZED_DIR}"
      -q
      --q-bits ${Q_BITS}
      --q-group-size ${Q_GROUP_SIZE}
    stdout: ${RESULTS_DIR}/log.txt
    stderr: ${RESULTS_DIR}/log.txt
    # mlx_lm.convert overwrites --mlx-path on each run, so a plain retry is
    # safe and doesn't need the checkpoint-resume dance finetune.yaml does.
    retryPolicy:
      limit: 3
      intervalSec: 30

handlerOn:
  success:
    command: >
      ${VENV}/bin/python ${DISTILL_HOME}/scripts/completion_hook.py
      --job-id "${JOB_ID}" --status complete
      --output-path "${QUANTIZED_DIR}"
  failure:
    command: >
      ${VENV}/bin/python ${DISTILL_HOME}/scripts/completion_hook.py
      --job-id "${JOB_ID}" --status failed
      --output-path "${QUANTIZED_DIR}"
      --diagnose
