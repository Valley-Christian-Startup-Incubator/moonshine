# LoRA fine-tuning DAG — runs mlx_lm.lora against INPUT_FILE (training
# JSONL), writing adapter weights under the results dir.

name: finetune
queue: mac-studio
maxActiveRuns: 1
timeoutSec: 43200 # 12 hours

params:
  - JOB_ID: ""
  - TEAM: ""
  - INPUT_FILE: ""
  - MODEL_PATH: mlx-community/Meta-Llama-3.1-8B-Instruct-4bit
  - ADAPTER_PATH: adapters
  - ITERS: 1000
  - BATCH_SIZE: 4
  - LEARNING_RATE: 1e-5
  - SAVE_EVERY: 100

env:
  - DISTILL_HOME: ${HOME}/.distill
  - VENV: ${HOME}/.distill-venv
  - PATH: ${HOME}/.distill-venv/bin:${PATH}

steps:
  - name: prepare
    command: >
      mkdir -p "${HOME}/.distill/results/${JOB_ID}"
      "${HOME}/.distill/results/${JOB_ID}/${ADAPTER_PATH}"

  - name: mark-running
    command: >
      ${VENV}/bin/python ${DISTILL_HOME}/scripts/completion_hook.py
      --job-id "${JOB_ID}" --status running

  - name: lora-train
    command: >
      bash ${DISTILL_HOME}/scripts/run_lora.sh
      "${MODEL_PATH}" "${INPUT_FILE}"
      "${HOME}/.distill/results/${JOB_ID}/${ADAPTER_PATH}"
      "${ITERS}" "${BATCH_SIZE}" "${LEARNING_RATE}" "${SAVE_EVERY}"
    stdout: ${HOME}/.distill/results/${JOB_ID}/log.txt
    stderr: ${HOME}/.distill/results/${JOB_ID}/log.txt
    # A retry resumes from the last checkpoint (see run_lora.sh) instead of
    # restarting a potentially 12-hour training run from iteration 0.
    retryPolicy:
      limit: 2
      intervalSec: 60

handlerOn:
  success:
    command: >
      ${VENV}/bin/python ${DISTILL_HOME}/scripts/completion_hook.py
      --job-id "${JOB_ID}" --status complete
      --output-path "${HOME}/.distill/results/${JOB_ID}/${ADAPTER_PATH}"
  failure:
    command: >
      ${VENV}/bin/python ${DISTILL_HOME}/scripts/completion_hook.py
      --job-id "${JOB_ID}" --status failed
      --output-path "${HOME}/.distill/results/${JOB_ID}/${ADAPTER_PATH}"
      --diagnose
